# Machine-canonical user decision ledger contract.
# The orchestrator is the only writer. YAML is intentionally simple so it can
# be inspected without a third-party runtime.
schema_version: "1.0"
ledger_type: "CUMCM_DECISION_LEDGER"

decision:
  required:
    - decision_id
    - decision_type
    - status
    - user_text
    - run_id
    - input_hash
    - created_at
  decision_type_values:
    - scope_confirmation
    - start_confirmation
    - g1_model_confirmation
    - g2_result_confirmation
    - delivery_confirmation
  status_values:
    - pending
    - confirmed
    - rejected
    - superseded
  rules:
    - "A decision is valid only when user_text explicitly names the scope or gate being confirmed."
    - "Generic acknowledgements such as 继续、可以、好的 do not confirm a gate."
    - "The decision input_hash must match the gate packet hash recorded in WORKFLOW_STATE."
    - "Professional agents may submit a packet but may not append or confirm a decision."

views:
  reports/USER_DECISIONS.md: "human-readable projection generated by orchestrator"
  reports/MVP_DECISION.md: "human-readable G2 projection generated by orchestrator"
  reports/TECHNICAL_DECISIONS.md: "non-gate technical proposals; never a user decision source"
